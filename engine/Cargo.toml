[package]
name = "vertex-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dependencies.uuid]
version = "1.23.3"
features = ["v4", "serde"]

[dev-dependencies]
tokio-stream = "0.1"

